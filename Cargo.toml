[package]
name = "rust-tetris"
version = "0.1.0"
edition = "2021"
authors = ["tjonestj3"]
description = "A high-performance Tetris implementation in Rust"
keywords = ["tetris", "game", "2d"]
categories = ["games"]

[[bin]]
name = "tetris"
path = "src/main.rs"

[dependencies]
# Graphics and rendering
macroquad = { version = "0.4", features = ["audio"] }
# Glyph rasterizing for our own text (graphics::text); the version macroquad uses.
fontdue = "0.9.3"

# Serialization for save data and settings
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Random number generation for piece spawning
rand = "0.8"

# Configuration management
config = "0.13"

# Logging
log = "0.4"
env_logger = "0.10"

# Date and time handling
chrono = { version = "0.4", features = ["serde"] }

# iOS: asking UIKit for the safe area (the same objc crate miniquad uses)
[target.'cfg(target_os = "ios")'.dependencies]
objc = { package = "objc-rs", version = "0.2" }

[workspace]
members = [".", "ios/rust"]

# miniquad 0.4.8 with one fix to its iOS touch handling (see vendor/miniquad/src/native/ios.rs,
# on_touch): lifting one finger no longer releases every finger. Desktop code is untouched.
[patch.crates-io]
miniquad = { path = "vendor/miniquad" }

[profile.release]
opt-level = 3
lto = "thin"
