# The Xcode project, generated by XcodeGen (`cd ios && xcodegen`) into ios/RustTetris.xcodeproj
# (not committed). The app is a thin shell: main.m calls the game's Rust code, built as a static
# library by build-rust.sh, plus a little Objective-C the game calls (App/Haptics.m); the sounds
# are the repo's assets/ folder, copied in as is.
name: RustTetris
options:
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"

targets:
  RustTetris:
    type: application
    platform: iOS
    # A shared scheme, so xcodebuild / fastlane can build it by name.
    scheme: {}
    sources:
      - path: App
      # The repo's sounds, as a folder: they land in the app as assets/sounds/*.wav, the same
      # paths the game loads on desktop.
      - path: ../assets
        type: folder
        buildPhase: resources
    preBuildScripts:
      - name: Build the Rust game library
        script: '"$SRCROOT/build-rust.sh"'
        basedOnDependencyAnalysis: false
    postBuildScripts:
      - name: Shrink the background music
        script: '"$SRCROOT/shrink-music.sh"'
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_NAME: RustTetris
        PRODUCT_BUNDLE_IDENTIFIER: com.tjonestj3.rusttetris
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_BITCODE: NO
        # Haptics.m (and GameCenter.m) are written for ARC.
        CLANG_ENABLE_OBJC_ARC: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        # Which Rust build to link (build-rust.sh makes the matching one).
        RUST_TARGET: aarch64-apple-ios
        "RUST_TARGET[sdk=iphonesimulator*]": aarch64-apple-ios-sim
        # The Rust library, and the system frameworks miniquad (graphics, input) and quad-snd
        # (sound) call into. A static library doesn't carry its link list, so it's spelled out.
        OTHER_LDFLAGS: >-
          $(inherited)
          "$(PROJECT_DIR)/../target/$(RUST_TARGET)/release/librust_tetris_ios.a"
          -lobjc
          -framework Foundation
          -framework UIKit
          -framework GLKit
          -framework OpenGLES
          -framework Metal
          -framework MetalKit
          -framework QuartzCore
          -framework CoreGraphics
          -framework ImageIO
          -framework Vision
          -framework AudioToolbox
          -framework CoreAudio
          -framework AVFoundation
          -framework Security
          -framework CoreHaptics
